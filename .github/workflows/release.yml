name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify tag matches plugin.yml version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin_version="$(grep '^version:' plugin.yml | awk '{print $2}')"
          if [ "$tag" != "$plugin_version" ]; then
            echo "tag $GITHUB_REF_NAME (=$tag) does not match plugin.yml version $plugin_version" >&2
            exit 1
          fi

          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build cross binaries
        run: make cross

      # The image comes before the release: the install hook of this
      # version pulls ghcr.io/thadeu/voodu-caddy:<version>, so a release
      # must never exist without its image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/thadeu/voodu-caddy:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/voodu-caddy_linux_amd64 \
            dist/voodu-caddy_linux_arm64
